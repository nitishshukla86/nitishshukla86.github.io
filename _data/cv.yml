- title: Ongoing Research Projects
  type: time_table
  contents:
    - title: Enhancing Single-Image Facial Demorphing using MLLMs
      year: 2026
      description:
        - Leveraged MLLM-derived semantic embeddings of morphs to condition a custom diffusion-based inpainting model, achieving 2–3% improvement in face recognition and biometric verification accuracy over baseline demorphing. (Under review, T-PAMI.)
    - title: Style-Aware Open-Set Image Retrieval via MLLMs
      year: 2025
      description:
        - Introduced an open-set image retrieval framework leveraging zero-shot MLLM reasoning and attention to extract attribute-disentangled embeddings (brushstrokes, color palette, composition) via contrastive learning, achieving 2–3% mAP gains without supervised fine-tuning. (Under review.)
    - title: Recursive Visual Pruning for Efficient Multi-Image Reasoning
      year: 2026
      description:
        - Designed an attention-guided recursive visual token pruning framework for vision-language models that reduces visual context via per-image budget allocation, enabling efficient multi-image inference without sacrificing reasoning accuracy. (In preparation.)

