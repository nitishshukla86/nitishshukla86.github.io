- title: Research Overview
  type: list
  contents:
    - My research lies at the intersection of representation learning and model reliability
      in deep learning, with a focus on how complex neural systems encode, reason over, and
      sometimes fail to disentangle fine-grained visual information in security-critical
      settings. I study how multimodal large language models (MLLMs) encode and reason over
      facial information, analyze failure modes in multi-image reasoning, and leverage
      internal representations for robust visual inference. A central theme of my work is
      generative face demorphing and biometric verification, where I develop diffusion-based
      inpainting models, benchmarks, and evaluation protocols that improve both face
      recognition accuracy and downstream morph attack detection.

